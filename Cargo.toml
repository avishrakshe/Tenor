[workspace]
resolver = "2"
members = [
    "crates/tenor-rules",
    "contracts/mock-ft",
    "contracts/blocklist",
    "contracts/tenor-oracle",
    "contracts/mock-swap",
    "contracts/guard",
    "contracts/tenor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/avishrakshe/Tenor"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
tenor-rules = { path = "crates/tenor-rules" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
